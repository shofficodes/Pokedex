<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/png">

    <link rel="stylesheet" href="./src/css/standart.css">
    <link rel="stylesheet" href="./src/css/fonts.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/pokemonCard.css">
    <link rel="stylesheet" href="./src/css/pokemonColors.css">
    <link rel="stylesheet" href="./src/css/themeColors.css">
    <link rel="stylesheet" href="./src/css/animations/loadingButton.css">
    <link rel="stylesheet" href="./src/css/animations/pokeballLoader.css">
    <link rel="stylesheet" href="./src/css/dialog.css">

    <script src="./src/js/pokeapi.js"></script>
    <script src="./src/js/templates.js"></script>
    <script src="./src/js/script.js"></script>
    <script src="./src/js/darkMode.js"></script>
    <script src="./src/js/consoleTests.js"></script>
    <script src="./src/js/localStorage.js"></script>
    <script src="./src/js/dialog.js"></script>
</head>

<body onload="init()">
    <header class="header">
        <img src="./assets/icons/logo-dex.png" alt="" class="logo">
        <div>
            <h1>POKÉDEX</h1>
            <div class="headerInfo">
                <p>GEN I</p>
                <p>·</p>
                <p>151 ENTRIES</p>
            </div>
        </div>
        <button id="favButton" class="favButton" onclick="showFavorites()" aria-label="Show favorites"><img src="./assets/icons/saved_icon.png"
                alt=""><span></span></button>
        <button class="darkButton" onclick="toggleDarkMode()" aria-label="Toggle dark mode">LIGHT</button>
        <div class="inputContainer">
            <div class="searchContainer">
                <input id="searchInput" data-id="search-input" type="search" placeholder="Search by name..." aria-label="Search Pokémon by name">
                <button class="searchButton" id="searchButton" data-id="search-button" aria-label="Search Pokémon">SEARCH</button>
            </div>
            <p id="searchHint">TYPE AT LEAST 3 CHARACTERS</p>
        </div>
    </header>

    <main data-id="content">
        <div class="mainInfo">
            <p>ALL POKÉMON</p>
            <div class="loadedAmountWrapper">
                <p id="loadedAmountCount">24</p><span>LOADED</span>
            </div>
        </div>

        <div id="pokeballLoader" class="pokeballLoader">
            <img src="./assets/icons/pokeball.png" alt="" class="pokeballSpinner" aria-hidden="true">
        </div>

        <ul class="pokemons" id="pokemons"></ul>
        <div class="loadMoreWrapper">
            <div class="loadMoreInner">
                <div class="loadMoreShadow"></div>
                <button onclick="loadMorePokemon()" class="loadMoreButton" id="loadMoreButton" data-id="load-more-button" aria-label="Load more Pokémon">LOAD MORE</button>
            </div>
        </div>
        <p class="loadedAmountInfo" id="loadedAmountInfo"></p>
    </main>

    <footer class="pageFooter">
        <div class="footerLine"></div>
        <div class="footerContent">
            <p>DATA · POKEAPI.COM</p>
            <p>RETRAINING PROJECT 2026</p>
        </div>
    </footer>

    <dialog id="pokemonDialog" data-id="dialog" class="pokemonDialog" aria-label="Pokémon details"></dialog>
</body>

</html>
