<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./src/css/standart.css">
    <link rel="stylesheet" href="./src/css/fonts.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/pokemonCard.css">

    <script src="./src/js/pokeapi.js"></script>
    <script src="./src/js/script.js"></script>
</head>

<body onload="init()">
    <header>
        <img src="./assets/icons/logo-dex.png" alt="Pokedex_Icon" class="logo">
        <div>
            <h1>POKÉDEX</h1>
            <div class="headerInfo">
                <p>GEN I</p>
                <p>·</p>
                <p>151 ENTRIES</p>
            </div>
        </div>
        <button class="favButton"><img src="./assets/icons/saved_icon.png" alt="favorite_icon"><span>0</span></button>
        <button class="darkButton">LIGHT</button>
        <div class="inputContainer">
            <div class="searchContainer">
                <input type="Search" placeholder="Search by name...">
                <button class="searchButton">SEARCH</button>
            </div>
            <p>TYPE AT LEAST 3 CHARACTERS</p>
        </div>
    </header>

    <body>
        <main>
            <div class="mainInfo">
                <p>ALL POKÉMON</p>
                <div class="loadedAmountWrapper">
                    <p>24</p><span>LOADED</span>
                </div>
            </div>

            <section class="pokemons">
                <div class="pokemonCardWrapper">
                    <section class="pokemonCard" data-id="card">
                        <header class="pokemonCardHeader">
                            <p>Num###</p>
                            <button class="cardFavButton" data-id="favButton" aria-label="Zu Favoriten hinzufügen">
                                <img src="./assets/icons/fav-off.png" alt="favorite_disabled_icon">
                            </button>
                        </header>

                        <div class="cardContent">
                            <h2>NAME</h2>
                            <div class="typeWrapper">
                                <span>Fire</span>
                                <span>Grass</span>
                            </div>
                            <div class="cardImgWrapper">
                                <img id="pokemonCardImg1" data-id="cardImage" src="./assets/test.png" alt="">
                            </div>
                        </div>
                        <p>#1</p>
                    </section>
                    <div class="pokemonCardShadow"></div>
                </div>
            </section>
        </main>
    </body>

    <footer>

    </footer>
</body>

</html>
